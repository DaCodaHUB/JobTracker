# JobMutations.graphql
mutation CreateJobApplication($input: CreateJobApplicationInput!) {
    createJobApplication(input: $input) {
        id
        companyName
        positionTitle
        status
        appliedDate
        location
        jobUrl
        notes
        idempotencyKey
        version
    }
}

# Update Application
mutation UpdateJobApplication($id: ID!, $status: String, $notes: String, $version: Int!) {
    updateJobApplication(id: $id, status: $status, notes: $notes, version: $version) {
        id
        status
        notes
        version
    }
}

# Delete Application
mutation DeleteJobApplication($id: ID!, $version: Int!) {
    deleteJobApplication(id: $id, version: $version)
}
